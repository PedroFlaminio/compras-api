# Lista de Compras (front) em /lista-compras e compras-api em /compras-api — incluído no server de restohub.com.br
location = /lista-compras {
  absolute_redirect off;
  return 301 /lista-compras/$is_args$args;
}

location ^~ /compras-api/ {
  proxy_pass http://127.0.0.1:3050;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $restohub_forwarded_proto;
}

location ^~ /lista-compras/assets/ {
  root /srv/compras/www;
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location ^~ /lista-compras/ {
  root /srv/compras/www;
  index index.html;
  try_files $uri $uri/ /lista-compras/index.html;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff always;
}
