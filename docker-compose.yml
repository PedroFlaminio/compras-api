services:
  api:
    container_name: compras
    hostname: compras
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3012:8080"

    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./dist:/app/dist:ro
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
      - ./prisma/migrations:/app/prisma/migrations:ro
      - ./package.json:/app/package.json:ro
    networks:
      - docker-server

networks:
  docker-server:
    external: true
